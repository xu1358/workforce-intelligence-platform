name: Python quality

on:
  push:
    branches:
      - master
      - revision-v2
  pull_request:
    branches:
      - master
      - revision-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pinned Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      - name: Install hashed dependency lock
        run: |
          python -m pip install "pip==26.0.1" "setuptools==83.0.0" "wheel==0.47.0"
          python -m pip install --no-build-isolation --require-hashes -r requirements-lock.txt

      - name: Validate dependency environment
        run: |
          python -m pip check
          python src/validate_dependency_environment.py

      - name: Validate Markdown and Mermaid rendering
        run: python src/validate_markdown_docs.py

      - name: Compile Python
        run: python -m compileall src dashboard tests

      - name: Lint Python
        run: python -m ruff check src dashboard tests

      - name: Check test formatting
        run: python -m ruff format --check tests

      - name: Run automated tests
        run: python -m pytest -q
