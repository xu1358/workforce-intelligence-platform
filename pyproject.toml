[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".venv",
    "data",
    "models",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.lint.per-file-ignores]
"src/analyze_employee_survival.py" = ["E402"]
"src/analyze_retention_explanations.py" = ["E402"]
"src/analyze_model_fairness.py" = ["E402"]
"src/evaluate_retention_ranking.py" = ["E402"]
"src/optimize_retention_policy.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
