version: "2.0"
description: >-
  Fixed candidate models and validation-only comparison policy for
  Checkpoint 41. The 2025 test target is not accessed.

candidate_models:
  Logistic Regression:
    model_type: "logistic_regression"
    complexity_rank: 1
    parameters:
      C: 1.0
      class_weight: "balanced"
      max_iter: 2000
      solver: "liblinear"
      random_state: 42
  Gradient Boosting:
    model_type: "gradient_boosting"
    complexity_rank: 2
    use_balanced_sample_weight: true
    parameters:
      n_estimators: 150
      learning_rate: 0.05
      max_depth: 2
      min_samples_leaf: 20
      subsample: 0.8
      random_state: 42
  Random Forest:
    model_type: "random_forest"
    complexity_rank: 3
    parameters:
      n_estimators: 300
      max_depth: 10
      min_samples_leaf: 10
      max_features: "sqrt"
      class_weight: "balanced_subsample"
      n_jobs: 1
      random_state: 42

evaluation:
  reporting_threshold: 0.50
  top_fraction: 0.10
  primary_metric: "pr_auc"
  metrics:
    - "pr_auc"
    - "roc_auc"
    - "brier_score"
    - "precision_at_0_50"
    - "recall_at_0_50"
    - "f1_at_0_50"
    - "top_decile_precision"
    - "top_decile_capture"
    - "top_decile_lift"

bootstrap:
  iterations: 500
  confidence_level: 0.95
  random_seed: 42
  method: "paired_stratified_validation_bootstrap"

selection:
  practical_pr_auc_tolerance: 0.01
  prefer_simpler_model_when_inconclusive: true
  complexity_preference:
    - "Logistic Regression"
    - "Gradient Boosting"
    - "Random Forest"

validation:
  minimum_validation_rows: 1000
  minimum_validation_positive_cases: 100
  expected_group_folds: 5
  probability_minimum: 0.0
  probability_maximum: 1.0
