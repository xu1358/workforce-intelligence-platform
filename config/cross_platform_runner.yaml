version: "1.0"
description: >
  Cross-platform execution contract for the reviewer-facing project runner and
  the archived checkpoint history.

canonical_runner: scripts/run_project.py
windows_wrapper: scripts/run_end_to_end.ps1
checkpoint_archive: scripts/checkpoints
scripts_guide: scripts/README.md

commands:
  - quality
  - validate
  - postgres
  - pipeline
  - dashboard
  - notebooks
  - organize-checkpoints

pipeline_options:
  - --skip-quality
  - --skip-data-generation
  - --skip-postgres
  - --include-legacy-v1
  - --skip-external-benchmark

quality_gates:
  - src/validate_dependency_environment.py
  - pip check
  - src/validate_markdown_docs.py
  - src/validate_cross_platform_runner.py
  - compileall
  - ruff check
  - ruff format --check
  - pytest

checkpoint_history:
  first: 36
  last: 65
  expected_count: 30

postgresql_v2_contract:
  preparation_steps: 6
  builder_source: postgresql
  parity_validator: src/validate_v2_postgresql_integration.py
  sql_equivalence_validator: src/validate_sql_temporal_equivalence.py
  csv_fallback_flag: --skip-postgres

expected_supporting_notebooks: 14

root_script_files:
  - README.md
  - run_end_to_end.ps1
  - run_project.py

governance:
  changes_analytical_scripts: false
  changes_model_results: false
  changes_frozen_policy: false
  changes_dashboard_data: false
  orchestration_only: true

output_directory: data/processed/cross_platform_runner
