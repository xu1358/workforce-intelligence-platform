version: "2.0"
description: >-
  Contract for the recruiter-facing README. Headline claims are tied to
  deterministic Version 2 outputs and must remain clearly synthetic.

readme_path: "README.md"
evidence_map_path: "docs/readme_evidence_map.md"

line_limits:
  minimum: 300
  maximum: 700

required_headings:
  - "## Business Decision"
  - "## Headline Results"
  - "## Analytical Design"
  - "## Model Development and Final Evaluation"
  - "## External Methodological Benchmark"
  - "## From Scores to a Retention Policy"
  - "## Manufacturing Workforce Stability"
  - "## Fairness, Ethics, and Governance"
  - "## Dashboard"
  - "## Curated Notebook Portfolio"
  - "## Setup"
  - "## Reproduce the Project"
  - "## Fast Local Validation"
  - "## Limitations"
  - "## Disclaimer"

required_phrases:
  - "every employee, candidate, outcome, salary, and business result in this repository is fictional"
  - "requires human review"
  - "prohibits automatic employment action"
  - "once-only out-of-time test"
  - "Estimated 12-month attrition probability"
  - "not directly comparable"

