version: "2.0"
description: >-
  Leakage-safe probability calibration for the provisional Logistic
  Regression selected in Checkpoint 41. The 2025 test target is not
  accessed.

selected_base_model: "Logistic Regression"

calibration_training:
  method: "out_of_fold_training_predictions"
  folds: 5
  shuffle: true
  random_seed: 42
  minimum_positive_cases_per_fold: 50
  probability_clip: 0.000001

methods:
  - "Uncalibrated"
  - "Sigmoid"
  - "Isotonic"

reliability:
  bins: 10
  binning_method: "equal_frequency"

bootstrap:
  iterations: 500
  confidence_level: 0.95
  random_seed: 42
  method: "paired_stratified_validation_bootstrap"

selection:
  primary_metric: "brier_score"
  practical_brier_tolerance: 0.002
  minimum_brier_improvement: 0.005
  prefer_simpler_method_when_close: true
  complexity_preference:
    - "Uncalibrated"
    - "Sigmoid"
    - "Isotonic"

dashboard_probability_policy:
  maximum_selected_ece: 0.03
  maximum_absolute_mean_calibration_gap: 0.02
  probability_label: "Estimated 12-month attrition probability"
  fallback_label: "Relative attrition risk score"

validation:
  minimum_training_rows: 1000
  minimum_validation_rows: 1000
  minimum_validation_positive_cases: 100
  expected_methods: 3
  maximum_ranking_metric_change: 0.02
  probability_minimum: 0.0
  probability_maximum: 1.0
